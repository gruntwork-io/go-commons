name: CI

# Runs on pushes to this repository only, so pull requests from forks never trigger it.
# To test a fork's pull request, a maintainer pushes its branch to this repository.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  # Skips lint and tests for pushes that touch only documentation. The tests need lint, so gating
  # lint skips them too, and skipped jobs still satisfy required checks.
  changes:
    name: Detect changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the merge base with master; file lists need no blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Detect changes
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: ./.github/scripts/detect-changes.sh "$BEFORE" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gocache-name: lint

      - name: Restore golangci-lint cache
        id: golangci-lint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-

      # The fast checks run first; every check runs even if an earlier one fails, so one run reports all of them.
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum are not tidy. Run 'go mod tidy' locally and commit the changes."
            exit 1
          fi

      # actionlint also runs shellcheck on every workflow run block.
      - name: Run actionlint
        if: ${{ !cancelled() }}
        run: actionlint

      - name: Run shellcheck
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: Run hadolint
        if: ${{ !cancelled() }}
        run: git ls-files -z '*Dockerfile*' | xargs -0 hadolint

      - name: Run golangci-lint
        if: ${{ !cancelled() }}
        run: golangci-lint run ./...

      - name: Save golangci-lint cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && steps.golangci-lint-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ steps.golangci-lint-cache.outputs.cache-primary-key }}

      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache-save

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gocache-name: unit-tests

      # The git tests run in Docker and clone public repos, so the default token is enough.
      - name: Run unit tests
        env:
          GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/logs
          gotestsum --format github-actions \
            --junitfile /tmp/logs/unit-tests.xml \
            --jsonfile /tmp/logs/unit-tests.json \
            --packages "$(go list ./... | grep -v -e '/awscommons/' -e '/lock$' -e '/ssh$')" \
            -- -count=1 -timeout 30m

      - name: Report test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: /tmp/logs/unit-tests.xml
          annotate_only: true
          detailed_summary: true
          include_time_in_summary: true
          group_suite: true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-logs
          path: /tmp/logs/
          retention-days: 14

      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache-save

  aws-tests:
    name: AWS Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gocache-name: aws-tests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::087285199408:role/go-commons-gha
          aws-region: us-east-1

      - name: Run AWS tests
        run: |
          mkdir -p /tmp/logs
          gotestsum --format github-actions \
            --junitfile /tmp/logs/aws-tests.xml \
            --jsonfile /tmp/logs/aws-tests.json \
            --packages "./awscommons/... ./lock/... ./ssh/..." \
            -- -count=1 -timeout 45m

      - name: Report test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: /tmp/logs/aws-tests.xml
          annotate_only: true
          detailed_summary: true
          include_time_in_summary: true
          group_suite: true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-test-logs
          path: /tmp/logs/
          retention-days: 14

      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache-save
