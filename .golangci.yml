version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  build-tags:
    - gittest

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - misspell
    - nilerr
    - whitespace

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
