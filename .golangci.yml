version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  build-tags:
    - gittest

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - misspell
    - nilerr
    - whitespace
  exclusions:
    # Pre-existing debt from before golangci-lint was introduced, held back per file so it can be
    # cleaned up incrementally. Delete a file's rule once it lints clean. The Full Lint workflow
    # drops every rule in this list to report the remaining debt, so keep permanent exclusions out
    # of it.
    rules:
      - path: ^awscommons/v2/errors\.go$
        linters:
          - staticcheck
      - path: ^collections/maps\.go$
        linters:
          - staticcheck
          - whitespace
      - path: ^collections/maps_test\.go$
        linters:
          - copyloopvar
          - gofmt
      - path: ^entrypoint/assertions_test\.go$
        linters:
          - errcheck
      - path: ^entrypoint/entrypoint\.go$
        linters:
          - errorlint
      - path: ^entrypoint/help_utils\.go$
        linters:
          - errcheck
          - gofmt
          - goimports
          - staticcheck
      - path: ^env/env_test\.go$
        linters:
          - copyloopvar
      - path: ^errors/errors\.go$
        linters:
          - errorlint
      - path: ^files/files\.go$
        linters:
          - gofmt
          - goimports
          - govet
          - staticcheck
      - path: ^files/files_test\.go$
        linters:
          - gofmt
          - goimports
          - govet
          - staticcheck
      - path: ^files/paths\.go$
        linters:
          - govet
          - staticcheck
      - path: ^git/git_test\.go$
        linters:
          - govet
          - staticcheck
      - path: ^lock/lock\.go$
        linters:
          - errorlint
      - path: ^lock/lock_test\.go$
        linters:
          - errcheck
          - goimports
      - path: ^logging/logging\.go$
        linters:
          - whitespace
      - path: ^retry/retry\.go$
        linters:
          - errorlint
      - path: ^retry/retry_test\.go$
        linters:
          - copyloopvar
      - path: ^shell/cmd\.go$
        linters:
          - staticcheck
      - path: ^shell/prompt\.go$
        linters:
          - errcheck
          - staticcheck
      - path: ^ssh/agent\.go$
        linters:
          - errcheck
          - govet
          - staticcheck
      - path: ^ssh/options\.go$
        linters:
          - staticcheck
          - whitespace
      - path: ^ssh/ssh_test\.go$
        linters:
          - copyloopvar
          - staticcheck
      - path: ^telemetry/mixpanel\.go$
        linters:
          - goimports
      - path: ^telemetry/telemetry\.go$
        linters:
          - unused
      - path: ^url/url_test\.go$
        linters:
          - copyloopvar
          - gofmt
          - goimports
          - unused

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
